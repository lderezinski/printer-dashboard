name: Security checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python3 scripts/install-gitleaks.py
      - run: npm run security:check
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev
      - run: npm test
      - run: python3 -m pip install -r requirements-security.txt
      - run: python3 -m pip_audit -r requirements-security.txt
      - run: python3 -m pip_audit -r requirements-obico.txt
